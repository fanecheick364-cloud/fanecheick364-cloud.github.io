<style>
:root{
  /* Maison d'édition numérique : noir profond, or champagne, papier. Mise en page éditoriale asymétrique, livres en volume. */
  --ink:#080808; --ink2:#111111; --ink3:#191817; --gold:#C8A96B; --gold-soft:#E4D2A6; --paper:#F5F2EC; --grey:#999999;
  --line:rgba(200,169,107,.20); --line2:rgba(245,242,236,.09);
  --display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Manrope","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --r:10px; --wrap:1180px; --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{max-width:100%}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(2.5rem,8.6vw,5.2rem)}
h2{font-size:clamp(1.9rem,5.4vw,3.1rem)}
h3{font-size:1.45rem}
p{margin:0}
.wrap{width:100%;max-width:var(--wrap);margin:0 auto;padding:0 20px}
.eyebrow{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:600}
.lead{color:#cfcabf;font-size:1.05rem;max-width:60ch}
.muted{color:var(--grey)}
.gold{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:99;background:var(--gold);color:#000;padding:8px 12px;border-radius:6px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:var(--r);font-weight:600;font-size:.95rem;letter-spacing:.02em;border:1px solid transparent;cursor:pointer;transition:transform .35s var(--ease),background .3s,color .3s,border-color .3s,box-shadow .35s;font-family:var(--body);text-align:center}
.btn svg{width:18px;height:18px;flex:none;transition:transform .35s var(--ease)}
.btn:hover svg.arrow{transform:translateX(4px)}
.btn-gold{background:linear-gradient(180deg,#d8bd84,#b8985a);color:#0b0906;box-shadow:0 10px 30px -12px rgba(200,169,107,.55)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 18px 40px -14px rgba(200,169,107,.75)}
.btn-line{border-color:var(--line);color:var(--paper);background:rgba(255,255,255,.02)}
.btn-line:hover{border-color:var(--gold);color:var(--gold-soft);transform:translateY(-2px)}
.btn-sm{min-height:44px;padding:0 18px;font-size:.86rem}
.btn-block{width:100%}

/* En-tête */
.hdr{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .4s,border-color .4s,backdrop-filter .4s;border-bottom:1px solid transparent}
.hdr.solid{background:rgba(8,8,8,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line2)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:1.28rem;letter-spacing:.2em;font-weight:600;white-space:nowrap}
.logo .mono{width:34px;height:34px;border:1px solid var(--gold);border-radius:8px;display:grid;place-items:center;color:var(--gold);font-size:.95rem;letter-spacing:0}
.nav{display:none;align-items:center;gap:26px;font-size:.88rem;color:#d6d1c6}
.nav a{position:relative;padding:6px 0}
.nav a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
.nav a:hover::after,.nav a[aria-current="page"]::after{transform:scaleX(1)}
.nav a[aria-current="page"]{color:var(--gold-soft)}
.hdr .cta{display:none}
.burger{width:46px;height:46px;border:1px solid var(--line);border-radius:10px;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--paper)}
.burger span{display:block;width:20px;height:1.5px;background:currentColor;position:relative;transition:background .2s}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:20px;height:1.5px;background:var(--paper);transition:transform .35s var(--ease)}
.burger span::before{transform:translateY(-6px)}.burger span::after{transform:translateY(6px)}
.burger[aria-expanded="true"] span{background:transparent}
.burger[aria-expanded="true"] span::before{transform:rotate(45deg)}
.burger[aria-expanded="true"] span::after{transform:rotate(-45deg)}
.menu{position:fixed;inset:68px 0 0 0;z-index:49;background:rgba(8,8,8,.98);padding:26px 20px 40px;display:flex;flex-direction:column;gap:4px;overflow:auto;transform:translateY(-12px);opacity:0;pointer-events:none;transition:opacity .3s,transform .4s var(--ease)}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu a.m{font-family:var(--display);font-size:1.9rem;padding:12px 0;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center}
.menu a.m span{font-family:var(--body);font-size:.7rem;letter-spacing:.2em;color:var(--gold)}
.menu .btn{margin-top:22px}
@media(min-width:1000px){.nav{display:flex}.hdr .cta{display:inline-flex}.burger,.menu{display:none}}

main{display:block;min-height:70vh}
.view{animation:viewIn .55s var(--ease)}
@keyframes viewIn{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .8s var(--ease) both}
@keyframes rise{from{transform:translateY(16px)}to{transform:none}}
section{padding:64px 0}
@media(min-width:800px){section{padding:96px 0}}
.sec-head{display:flex;flex-direction:column;gap:14px;margin-bottom:36px}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);width:120px;opacity:.7}

/* Hero */
.hero{position:relative;padding:120px 0 56px;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:
  radial-gradient(60% 55% at 78% 30%,rgba(200,169,107,.20),transparent 62%),
  radial-gradient(40% 40% at 12% 90%,rgba(200,169,107,.08),transparent 70%),
  linear-gradient(180deg,#0b0a09 0%,#080808 70%)}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.hero-grid{display:grid;gap:44px;align-items:center}
.hero h1 em{font-style:italic;color:var(--gold-soft)}
.hero .lead{margin-top:20px}
.hero .actions{display:flex;flex-direction:column;gap:12px;margin-top:30px}
.hero .facts{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:30px;font-size:.84rem;color:#bdb7ab}
.hero .facts span{display:inline-flex;gap:8px;align-items:center}
.hero .facts svg{width:16px;height:16px;color:var(--gold)}
.scene{position:relative;height:380px;perspective:1400px;transition:transform .5s var(--ease)}
.desk{position:absolute;left:4%;right:4%;bottom:26px;height:2px;background:linear-gradient(90deg,transparent,rgba(200,169,107,.5),transparent)}
.desk::after{content:"";position:absolute;left:10%;right:10%;top:2px;height:70px;background:radial-gradient(50% 100% at 50% 0,rgba(200,169,107,.16),transparent 70%)}
.tablet{position:absolute;left:50%;bottom:40px;width:210px;aspect-ratio:3/4;transform:translateX(-58%) rotateY(14deg) rotateX(4deg);border-radius:18px;background:#0e0e0e;border:1px solid #2a2824;padding:10px;box-shadow:0 40px 80px -30px #000,0 0 90px -20px rgba(200,169,107,.35);transform-style:preserve-3d}
.tablet .cover{height:100%;border-radius:10px}
.scene .book{position:absolute;bottom:40px}
.scene .b1{right:3%;--w:120px;transform:rotateY(-30deg) rotateX(3deg)}
.scene .b2{left:2%;--w:104px;transform:rotateY(26deg) rotateX(3deg)}
.lamp{position:absolute;right:16%;top:0;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(228,210,166,.32),transparent 65%);filter:blur(6px);animation:glow 7s ease-in-out infinite}
@keyframes glow{50%{opacity:.6;transform:scale(1.08)}}
@media(min-width:900px){
  .hero{padding:150px 0 90px}
  .hero-grid{grid-template-columns:1.05fr .95fr}
  .hero .actions{flex-direction:row}
  .scene{height:520px}.tablet{width:290px}.scene .b1{--w:170px}.scene .b2{--w:150px}
}

/* Couvertures */
.cover{position:relative;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:2/3;padding:9% 9% 8%;border-radius:4px 8px 8px 4px;overflow:hidden;color:var(--paper);
  background:radial-gradient(120% 80% at 0% 0%,color-mix(in srgb,var(--tint,#C8A96B) 34%,transparent),transparent 60%),linear-gradient(160deg,#171614,#0a0a0a 70%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.cover::before{content:"";position:absolute;inset:5%;border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:2px;pointer-events:none}
.cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:7%;background:linear-gradient(90deg,rgba(0,0,0,.55),transparent);pointer-events:none}
.cover.has-img{padding:0;background:#0d0d0d}.cover.has-img::before{display:none}.cover.has-img img{width:100%;height:100%;object-fit:cover;display:block}
.cover .c-cat{font-size:.5em;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700;position:relative;z-index:1}
.cover .c-mark{position:absolute;right:-4%;bottom:14%;font-family:var(--display);font-size:5.6em;line-height:.8;color:color-mix(in srgb,var(--tint,#C8A96B) 26%,transparent);font-weight:600;letter-spacing:-.04em;white-space:nowrap}
.cover .c-title{font-family:var(--display);font-size:1.5em;line-height:1.02;font-weight:600;position:relative;z-index:1;text-wrap:balance}
.cover .c-sub{font-size:.52em;color:#cfc9bc;margin-top:.9em;line-height:1.4;position:relative;z-index:1}
.cover .c-foot{font-size:.46em;letter-spacing:.3em;color:var(--gold-soft);position:relative;z-index:1;display:flex;justify-content:space-between;gap:6px}
.book{--w:200px;--d:26px;width:var(--w);aspect-ratio:2/3;position:relative;transform-style:preserve-3d;transform:rotateY(-24deg) rotateX(4deg);transition:transform .8s var(--ease);font-size:calc(var(--w)/11.5)}
.book .cover{position:absolute;inset:0;transform:translateZ(calc(var(--d)/2));aspect-ratio:auto}
.book::before{content:"";position:absolute;top:1.2%;left:0;height:97.6%;width:var(--d);transform:translateX(calc(var(--w) - var(--d)/2 - 2px)) rotateY(90deg);background:repeating-linear-gradient(90deg,#efe9dc 0 1px,#cfc7b6 1px 2.4px)}
.book::after{content:"";position:absolute;inset:0;transform:translateZ(calc(var(--d)/-2));background:#060606;border-radius:4px 8px 8px 4px;box-shadow:-26px 30px 60px -10px rgba(0,0,0,.85),0 0 80px -30px rgba(200,169,107,.4)}
.book-stage{perspective:1500px;display:grid;place-items:center;padding:30px 0}
.book-stage:hover .book{transform:rotateY(-12deg) rotateX(2deg)}

/* Grille catalogue */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 14px;margin:0 -20px 22px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);font-size:.84rem;display:inline-flex;align-items:center;gap:8px;color:#d6d1c6;transition:border-color .3s,color .3s,background .3s;background:transparent;font-family:var(--body);cursor:pointer}
.chip:hover{border-color:var(--gold)}
.chip[aria-current="true"]{background:var(--gold);color:#0b0906;border-color:var(--gold);font-weight:700}
.chip small{font-size:.68rem;opacity:.7}
.chip.soon{opacity:.5;cursor:default}
.grid{display:grid;gap:18px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}}
@media(min-width:1080px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;background:var(--ink2);border:1px solid var(--line2);border-radius:14px;overflow:hidden;transition:transform .5s var(--ease),border-color .4s,box-shadow .5s}
.card:hover{transform:translateY(-6px);border-color:var(--line);box-shadow:0 30px 60px -30px #000,0 0 60px -30px rgba(200,169,107,.35)}
.card .shot{padding:18px 18px 0;background:radial-gradient(90% 70% at 50% 0,rgba(200,169,107,.10),transparent 70%);display:block}
.card .shot .cover{font-size:clamp(9px,2.6vw,13px);transition:transform .6s var(--ease);box-shadow:0 22px 40px -18px #000,inset 0 0 0 1px rgba(255,255,255,.05)}
.card:hover .shot .cover{transform:translateY(-4px) rotate(-1.2deg)}
.card .body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:1.18rem;line-height:1.15}
.card .desc{font-size:.84rem;color:#b9b3a7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--grey)}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.price b{font-family:var(--display);font-size:1.5rem;font-weight:600;color:var(--gold-soft)}
.price s{color:var(--grey);font-size:.86rem}
.card .acts{display:grid;gap:8px;margin-top:auto;padding-top:8px}
@media(max-width:420px){.card .body{padding:12px}.card .btn-sm{padding:0 10px;font-size:.78rem}}

/* Blocs */
.cols{display:grid;gap:22px}
@media(min-width:860px){.cols.c2{grid-template-columns:1fr 1fr;gap:56px}.cols.c3{grid-template-columns:repeat(3,1fr)}.cols.c4{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--ink2);border:1px solid var(--line2);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:10px;transition:border-color .4s,transform .5s var(--ease)}
.tile:hover{border-color:var(--line);transform:translateY(-3px)}
.tile .ic{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold)}
.tile .ic svg{width:22px;height:22px}
.tile p{color:#bdb7ab;font-size:.92rem}
.band{background:linear-gradient(180deg,#0c0b0a,#0f0e0c);border-block:1px solid var(--line2)}
.quote{font-family:var(--display);font-size:clamp(1.5rem,4.4vw,2.5rem);line-height:1.2;font-style:italic;color:var(--gold-soft);max-width:22ch}
.cat-list{display:grid;gap:0;border-top:1px solid var(--line2)}
.cat-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 4px;border-bottom:1px solid var(--line2);transition:padding .4s var(--ease),color .3s}
a.cat-row:hover{padding-left:14px;color:var(--gold-soft)}
.cat-row h3{font-size:clamp(1.3rem,4vw,1.9rem)}
.cat-row span{font-size:.78rem;color:var(--grey);white-space:nowrap}
.empty{border:1px dashed var(--line);border-radius:14px;padding:26px;color:#bdb7ab;font-size:.95rem;background:rgba(200,169,107,.03)}
.prov{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--gold);color:var(--gold);padding:4px 10px;border-radius:999px;font-weight:700}

/* Page produit */
.crumb{font-size:.8rem;color:var(--grey);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.crumb a:hover{color:var(--gold)}
.p-hero{padding:104px 0 40px;position:relative;isolation:isolate}
.p-hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(50% 60% at 22% 40%,color-mix(in srgb,var(--tint,#C8A96B) 22%,transparent),transparent 65%)}
.p-grid{display:grid;gap:26px;align-items:center}
@media(min-width:900px){.p-hero{padding:140px 0 70px}.p-grid{grid-template-columns:.85fr 1.15fr;gap:60px}.p-grid .book{--w:300px}}
.p-info{display:flex;flex-direction:column;gap:16px}
.p-info h1{font-size:clamp(2.1rem,6.4vw,3.6rem)}
.p-info .sub{font-size:1.08rem;color:#d6d1c6}
.p-benefit{border-left:2px solid var(--gold);padding:4px 0 4px 16px;color:var(--gold-soft);font-family:var(--display);font-size:1.3rem;line-height:1.3;font-style:italic}
.p-info .price b{font-size:2.3rem}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;padding:7px 12px;border:1px solid var(--line2);border-radius:999px;color:#d6d1c6}
.badge svg{width:15px;height:15px;color:var(--gold)}
.note{font-size:.8rem;color:var(--grey)}
.qa{display:grid;gap:14px}
@media(min-width:860px){.qa{grid-template-columns:1fr 1fr}}
.qa .tile h3{font-size:1.3rem}
.qa ul,.plain{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.qa li,.plain li{position:relative;padding-left:22px;color:#cfcabf;font-size:.93rem}
.qa li::before,.plain li::before{content:"";position:absolute;left:0;top:.62em;width:10px;height:1px;background:var(--gold)}
.toc{counter-reset:ch;display:grid;gap:0;border-top:1px solid var(--line2)}
.toc li{counter-increment:ch;list-style:none;display:grid;grid-template-columns:54px 1fr;gap:6px 10px;padding:18px 0;border-bottom:1px solid var(--line2)}
.toc li::before{content:counter(ch,decimal-leading-zero);font-family:var(--display);font-size:1.6rem;color:var(--gold);line-height:1}
.toc b{font-weight:600;display:block}
.toc span{color:#b9b3a7;font-size:.9rem;grid-column:2}
.pages{display:flex;gap:16px;overflow-x:auto;padding:6px 20px 18px;margin:0 -20px;scroll-snap-type:x mandatory}
.page{flex:none;width:232px;aspect-ratio:3/4;background:var(--paper);color:#1b1a18;border-radius:6px;padding:22px 20px;scroll-snap-align:center;display:flex;flex-direction:column;gap:10px;box-shadow:0 26px 50px -24px #000;transition:transform .5s var(--ease)}
.page:hover{transform:translateY(-6px) rotate(-.6deg)}
.page .pn{font-size:.62rem;letter-spacing:.2em;color:#8a7a52;text-transform:uppercase;font-weight:700}
.page h4{font-family:var(--display);font-size:1.3rem;line-height:1.1;margin:0;font-weight:600}
.page p{font-size:.72rem;line-height:1.5;color:#44413b}
.page i{display:block;height:5px;border-radius:3px;background:#dcd6c8;margin-top:5px}
.page .foot{margin-top:auto;font-size:.56rem;letter-spacing:.2em;color:#8a7a52;display:flex;justify-content:space-between}
details{border-bottom:1px solid var(--line2)}
details summary{list-style:none;cursor:pointer;padding:20px 40px 20px 0;position:relative;font-family:var(--display);font-size:1.3rem;line-height:1.2}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"";position:absolute;right:6px;top:50%;width:12px;height:12px;border-right:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold);transform:translateY(-70%) rotate(45deg);transition:transform .4s var(--ease)}
